<!DOCTYPE html>
             <html>
<head>
    <title>min function</title>
    <style>
        .min-box{
            Background-color:cornflowerblue;
            Width: min(90%,600px);
            Padding: 20px;
        }
    </style>
</head>
<body>
    <div class=”min-box”>This box is no wider than 300px or 80% of the screen,whichever is smaller.</div>
</body>
</html>
